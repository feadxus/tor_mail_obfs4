name: FSXEDX-定时获取

on:
  schedule:
    # 💡 完美错峰机制:单数日 UTC 08:00 运行,双数日 UTC 09:00 运行,完美绕过 24h 频率锁定
    - cron: '0 8 1-31/2 * *'
    - cron: '0 9 2-30/2 * *'
  workflow_dispatch: # 保留手动触发按钮

jobs:
  fetch-bridges:
    runs-on: ubuntu-latest
    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 配置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: ☁️ 安装 Google Drive 工具 (rclone) 与 skopeo
      run: |
        sudo apt-get update && sudo apt-get install -y skopeo
        curl https://rclone.org/install.sh | sudo bash

    - name: Setup rclone config
      env:
        RCLONE_SECRET_DATA: ${{ secrets.GOOGLE_FSXEDX_DRIVE }}
      run: |
        mkdir -p ~/.config/rclone
        echo "$RCLONE_SECRET_DATA" > ~/.config/rclone/rclone.conf

    - name: 安装谷歌官方 API 依赖
      run: python go.py

    - name: 执行发信与回捞闭环脚本
      env:
        # 核心安全:将 Secrets 中锁死的 JSON 注入进运行环境
        GOOGLE_FSXEDX_GMAIL: ${{ secrets.GOOGLE_FSXEDX_GMAIL }}
      run: python fsxedx_send_tor_mail.py
